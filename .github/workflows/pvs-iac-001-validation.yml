name: PVS-IAC-001 Validation

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pvs-iac-001-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Terraform and collect Evidence
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    env:
      TF_DIR: infrastructure/powervs/minimal
      EVIDENCE_DIR: validation-evidence/pvs-iac-001

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          clean: true

      - name: Capture validation environment
        shell: bash
        run: |
          set -eu
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "task_id=PVS-IAC-001"
            echo "requested_ref=${{ inputs.target_ref }}"
            echo "validated_git_revision=$(git rev-parse HEAD)"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_actor=${GITHUB_ACTOR}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "hostname=$(hostname)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "uname=$(uname -a)"
          } > "$EVIDENCE_DIR/environment.txt"

          terraform version > "$EVIDENCE_DIR/terraform-version.txt" 2>&1
          gitleaks version > "$EVIDENCE_DIR/gitleaks-version.txt" 2>&1

      - name: Run required tests
        id: required_tests
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR"
          SUMMARY="$EVIDENCE_DIR/results.txt"
          : > "$SUMMARY"

          if [ ! -d "$TF_DIR" ]; then
            echo "preflight: FAIL - Terraform directory not found: $TF_DIR" | tee -a "$SUMMARY"
            exit 2
          fi

          run_test() {
            name="$1"
            shift
            log="$EVIDENCE_DIR/${name}.log"

            echo "command[$name]=$*" >> "$SUMMARY"
            "$@" > "$log" 2>&1
            rc=$?
            echo "exit_code[$name]=$rc" >> "$SUMMARY"

            if [ "$rc" -eq 0 ]; then
              echo "result[$name]=PASS" >> "$SUMMARY"
            else
              echo "result[$name]=FAIL" >> "$SUMMARY"
            fi

            return "$rc"
          }

          run_negative_test() {
            name="$1"
            shift
            log="$EVIDENCE_DIR/${name}.log"

            echo "command[$name]=$*" >> "$SUMMARY"
            "$@" > "$log" 2>&1
            rc=$?
            echo "exit_code[$name]=$rc" >> "$SUMMARY"

            if [ "$rc" -ne 0 ]; then
              echo "result[$name]=PASS_EXPECTED_FAILURE" >> "$SUMMARY"
              return 0
            fi

            echo "result[$name]=FAIL_UNEXPECTED_PASS" >> "$SUMMARY"
            return 1
          }

          LIVE_READY_FIXTURE="$RUNNER_TEMP/pvs-iac-002-live-ready.tfvars"
          ENABLE_FALSE_FIXTURE="$RUNNER_TEMP/pvs-iac-002-enable-false.tfvars"
          PRIVATE_ROUTE_FALSE_FIXTURE="$RUNNER_TEMP/pvs-iac-002-private-route-false.tfvars"

          cat > "$LIVE_READY_FIXTURE" <<'EOF'
          enable_live_resources = true
          ibm_region = "jp-tok"
          powervs_zone = "tok04"
          resource_group_id = "11111111111111111111111111111111"
          name_prefix = "aix-iac-pvs-ci"
          ssh_public_key = "ssh-rsa AAAA1111 pvs-iac-ci"
          ssh_key_visibility = "workspace"
          aix_stock_image_id = "11111111-1111-1111-1111-111111111111"
          aix_stock_image_name = "AIX-ci-stock-image"
          network_cidr = "192.168.100.0/24"
          network_gateway = "192.168.100.1"
          network_dns = ["9.9.9.9"]
          network_ip_start = "192.168.100.10"
          network_ip_end = "192.168.100.200"
          aix_evidence_reachability_mode = "private-network"
          public_network_exposure_reviewed = false
          private_network_route_reviewed = true
          aix_evidence_ssh_user = "root"
          aix_instance_memory_gb = 4
          aix_instance_processors = 0.25
          aix_processor_type = "shared"
          aix_system_type = "s922"
          data_volume_size_gb = 20
          data_volume_type = "tier3"
          EOF

          cat > "$ENABLE_FALSE_FIXTURE" <<'EOF'
          enable_live_resources = false
          ibm_region = "jp-tok"
          powervs_zone = "tok04"
          resource_group_id = "11111111111111111111111111111111"
          name_prefix = "aix-iac-pvs-ci"
          ssh_public_key = "ssh-rsa AAAA1111 pvs-iac-ci"
          ssh_key_visibility = "workspace"
          aix_stock_image_id = "11111111-1111-1111-1111-111111111111"
          aix_stock_image_name = "AIX-ci-stock-image"
          aix_evidence_reachability_mode = "private-network"
          public_network_exposure_reviewed = false
          private_network_route_reviewed = true
          aix_evidence_ssh_user = "root"
          EOF

          cat > "$PRIVATE_ROUTE_FALSE_FIXTURE" <<'EOF'
          enable_live_resources = true
          ibm_region = "jp-tok"
          powervs_zone = "tok04"
          resource_group_id = "11111111111111111111111111111111"
          name_prefix = "aix-iac-pvs-ci"
          ssh_public_key = "ssh-rsa AAAA1111 pvs-iac-ci"
          ssh_key_visibility = "workspace"
          aix_stock_image_id = "11111111-1111-1111-1111-111111111111"
          aix_stock_image_name = "AIX-ci-stock-image"
          aix_evidence_reachability_mode = "private-network"
          public_network_exposure_reviewed = false
          private_network_route_reviewed = false
          aix_evidence_ssh_user = "root"
          EOF

          overall=0

          run_test preflight-safe-template sh -c "cd '$TF_DIR' && sh scripts/preflight.sh"
          rc=$?
          [ "$rc" -eq 0 ] || overall=1

          run_test preflight-live-ready-synthetic env IC_API_KEY=ci-dummy-preflight-only sh -c "cd '$TF_DIR' && sh scripts/preflight.sh '$LIVE_READY_FIXTURE'"
          rc=$?
          [ "$rc" -eq 0 ] || overall=1

          run_negative_test preflight-live-ready-enable-false env IC_API_KEY=ci-dummy-preflight-only sh -c "cd '$TF_DIR' && sh scripts/preflight.sh '$ENABLE_FALSE_FIXTURE'"
          rc=$?
          [ "$rc" -eq 0 ] || overall=1

          run_negative_test preflight-live-ready-private-route-false env IC_API_KEY=ci-dummy-preflight-only sh -c "cd '$TF_DIR' && sh scripts/preflight.sh '$PRIVATE_ROUTE_FALSE_FIXTURE'"
          rc=$?
          [ "$rc" -eq 0 ] || overall=1

          run_test terraform-fmt terraform -chdir="$TF_DIR" fmt -check -diff -recursive -no-color
          rc=$?
          [ "$rc" -eq 0 ] || overall=1

          run_test terraform-init terraform -chdir="$TF_DIR" init -backend=false -input=false -no-color
          rc=$?
          [ "$rc" -eq 0 ] || overall=1

          if [ "$rc" -eq 0 ]; then
            terraform -chdir="$TF_DIR" providers > "$EVIDENCE_DIR/terraform-providers.txt" 2>&1
            provider_rc=$?
            echo "command[terraform-providers]=terraform -chdir=$TF_DIR providers" >> "$SUMMARY"
            echo "exit_code[terraform-providers]=$provider_rc" >> "$SUMMARY"
            [ "$provider_rc" -eq 0 ] || overall=1
          else
            echo "terraform-providers: SKIPPED - terraform init failed" >> "$SUMMARY"
          fi

          run_test terraform-validate terraform -chdir="$TF_DIR" validate -no-color
          rc=$?
          [ "$rc" -eq 0 ] || overall=1

          echo "command[gitleaks]=gitleaks git --no-banner --redact --report-format=json --report-path=$EVIDENCE_DIR/gitleaks-report.json ." >> "$SUMMARY"
          gitleaks git --no-banner --redact --report-format=json --report-path="$EVIDENCE_DIR/gitleaks-report.json" . > "$EVIDENCE_DIR/gitleaks.log" 2>&1
          rc=$?
          echo "exit_code[gitleaks]=$rc" >> "$SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "result[gitleaks]=PASS" >> "$SUMMARY"
          else
            echo "result[gitleaks]=FAIL" >> "$SUMMARY"
            overall=1
          fi

          exit "$overall"

      - name: Capture final Evidence snapshot
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/validated-revision.txt" 2>&1
          git status --short > "$EVIDENCE_DIR/git-status-after-validation.txt" 2>&1
          git diff --stat > "$EVIDENCE_DIR/git-diff-stat-after-validation.txt" 2>&1

          if [ -f "$TF_DIR/.terraform.lock.hcl" ]; then
            cp "$TF_DIR/.terraform.lock.hcl" "$EVIDENCE_DIR/terraform.lock.hcl"
            sha256sum "$TF_DIR/.terraform.lock.hcl" > "$EVIDENCE_DIR/terraform-lock-sha256.txt"
          fi

      - name: Upload Validation Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvs-iac-001-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-evidence/pvs-iac-001/
          if-no-files-found: error
          retention-days: 30
